<!-- Supabase Auth -> Reset Password template.
     Paste into Dashboard -> Authentication -> Emails -> Templates.
     {{ .Token }} renders the 8-digit code (otp_length = 8 in config.toml). -->
<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#f8fafc;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
  <tr><td align="center">
    <table width="560" cellpadding="0" cellspacing="0" role="presentation" style="max-width:560px;width:100%;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;">
      <tr><td align="center" style="padding:28px 24px 0;">
        <img src="https://uibbavdzxmictgqdcuny.supabase.co/storage/v1/object/public/branding-assets/logo/1781848655430.png"
             alt="EduBridge MentorConnect" height="40"
             style="height:40px;width:auto;max-width:200px;display:block;border:0;outline:none;text-decoration:none;" />
      </td></tr>
      <tr><td style="padding:20px 24px 8px;">
        <h1 style="margin:0 0 12px;font-size:21px;font-weight:700;line-height:1.3;color:#0d0d0d;">Your verification code</h1>
        <p style="margin:0;font-size:14px;line-height:1.6;color:#475569;">
          Use the code below to reset your EduBridge MentorConnect password. It expires shortly, so use it soon.
        </p>
      </td></tr>
      <tr><td align="center" style="padding:20px 24px 4px;">
        <div style="display:inline-block;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:16px 28px;font-size:30px;font-weight:700;letter-spacing:6px;color:#1e3a8a;font-family:'SFMono-Regular',Menlo,Consolas,monospace;">{{ .Token }}</div>
      </td></tr>
      <tr><td style="padding:12px 24px 8px;">
        <p style="margin:0;font-size:12px;line-height:1.5;color:#475569;">
          If you did not request a password reset you can safely ignore this email — your password will not change.
        </p>
      </td></tr>
      <tr><td style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:16px 24px;text-align:center;">
        <span style="font-size:11px;color:#475569;">Sent by EduBridge MentorConnect.</span>
      </td></tr>
    </table>
  </td></tr>
</table>
